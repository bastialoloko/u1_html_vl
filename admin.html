<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Gestión de Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .badge-admin {
            background-color: #dc3545;
        }

        .badge-coach {
            background-color: #0d6efd;
        }

        .badge-user {
            background-color: #198754;
        }

        .error-text {
            color: #dc3545;
            font-size: 0.85rem;
        }
    </style>
</head>

<body>
    <header class="main-header">
        <div class="logo-container"><img src="img/logo.png" alt="Logo" class="logo-img"></div>
        <nav><a href="admin.html">Usuarios</a><a href="perfil.html">Mi Perfil</a><a href="#" id="logoutAdmin">Cerrar
                sesión</a></nav>
    </header>
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Gestión de Usuarios</h2>
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#userModal"
                onclick="openCreateModal()">Nuevo Usuario</button>
        </div>
        <div class="card shadow">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Email</th>
                                <th>Rol</th>
                                <th>Fecha registro</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para crear/editar usuario -->
    <div class="modal fade" id="userModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Crear Usuario</h5><button type="button" class="btn-close"
                        data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="userForm">
                        <input type="hidden" id="userId">
                        <div class="mb-2"><label>Nombre completo</label><input type="text" id="fullName"
                                class="form-control" required>
                            <div id="nameError" class="error-text"></div>
                        </div>
                        <div class="mb-2"><label>Email</label><input type="email" id="email" class="form-control"
                                required>
                            <div id="emailError" class="error-text"></div>
                        </div>
                        <div class="mb-2"><label>Rol</label><select id="role" class="form-select">
                                <option value="user">Usuario</option>
                                <option value="coach">Coach</option>
                                <option value="admin">Administrador</option>
                            </select></div>
                        <div class="mb-2" id="passwordGroup"><label>Contraseña</label><input type="password"
                                id="password" class="form-control">
                            <div id="pwdError" class="error-text"></div>
                        </div>
                        <div class="mb-2" id="confirmGroup"><label>Confirmar contraseña</label><input type="password"
                                id="confirmPwd" class="form-control"></div>
                    </form>
                </div>
                <div class="modal-footer"><button type="button" class="btn btn-secondary"
                        data-bs-dismiss="modal">Cancelar</button><button type="button" class="btn btn-primary"
                        id="saveUserBtn">Guardar</button></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = 'http://localhost:3000/api';
        let usersList = [];
        let editingId = null;

        // Verificar token y rol
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';

        fetch(`${API_URL}/auth/me`, { headers: { 'Authorization': `Bearer ${token}` } })
            .then(res => res.json())
            .then(user => {
                if (user.role !== 'admin') window.location.href = 'dashboard-usuario.html';
            })
            .catch(() => window.location.href = 'login.html');

        function getToken() { return localStorage.getItem('token'); }
        function logout() { localStorage.clear(); window.location.href = 'login.html'; }

        async function loadUsers() {
            const token = getToken();
            const res = await fetch(`${API_URL}/users`, { headers: { 'Authorization': `Bearer ${token}` } });
            if (!res.ok) return logout();
            const users = await res.json();
            usersList = users;
            const tbody = document.getElementById('usersTableBody');
            tbody.innerHTML = '';
            users.forEach(u => {
                const date = new Date(u.created_at).toLocaleDateString('es-ES');
                tbody.innerHTML += `<tr>
                    <td>${u.id}</td><td>${u.full_name}</td><td>${u.email}</td>
                    <td><span class="badge badge-${u.role}">${u.role}</span></td>
                    <td>${date}</td>
                    <td><button class="btn btn-sm btn-warning" onclick="editUser(${u.id})">Editar</button> <button class="btn btn-sm btn-danger" onclick="deleteUser(${u.id})">Eliminar</button></td>
                </table>`;
            });
        }

        function openCreateModal() { editingId = null; document.getElementById('modalTitle').innerText = 'Crear Usuario'; document.getElementById('userForm').reset(); document.getElementById('passwordGroup').style.display = 'block'; document.getElementById('confirmGroup').style.display = 'block'; new bootstrap.Modal(document.getElementById('userModal')).show(); }
        async function editUser(id) {
            editingId = id;
            const user = usersList.find(u => u.id == id);
            document.getElementById('fullName').value = user.full_name;
            document.getElementById('email').value = user.email;
            document.getElementById('role').value = user.role;
            document.getElementById('passwordGroup').style.display = 'none';
            document.getElementById('confirmGroup').style.display = 'none';
            document.getElementById('modalTitle').innerText = 'Editar Usuario';
            new bootstrap.Modal(document.getElementById('userModal')).show();
        }
        document.getElementById('saveUserBtn').onclick = async () => {
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const role = document.getElementById('role').value;
            let password = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPwd').value;
            document.querySelectorAll('.error-text').forEach(e => e.textContent = '');
            let ok = true;
            if (!fullName) { document.getElementById('nameError').textContent = 'Requerido'; ok = false; }
            if (!email || !email.includes('@')) { document.getElementById('emailError').textContent = 'Email inválido'; ok = false; }
            if (!editingId && !password) { document.getElementById('pwdError').textContent = 'Contraseña requerida'; ok = false; }
            if (!editingId && password !== confirm) { document.getElementById('pwdError').textContent = 'No coinciden'; ok = false; }
            if (!ok) return;
            const token = getToken();
            let url = `${API_URL}/users`;
            let method = 'POST';
            let body = { full_name: fullName, email, role };
            if (editingId) { url += `/${editingId}`; method = 'PUT'; }
            else { body.password = password; }
            try {
                const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify(body) });
                if (!res.ok) throw new Error('Error');
                bootstrap.Modal.getInstance(document.getElementById('userModal')).hide();
                loadUsers();
            } catch (err) { alert('Error al guardar'); }
        };
        async function deleteUser(id) {
            if (!confirm('¿Eliminar usuario?')) return;
            const token = getToken();
            await fetch(`${API_URL}/users/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
            loadUsers();
        }
        document.getElementById('logoutAdmin').onclick = (e) => { e.preventDefault(); logout(); };
        loadUsers();
    </script>
</body>

</html>
