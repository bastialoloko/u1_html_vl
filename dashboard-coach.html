<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportClub - Panel Coach</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .perfil-coach nav a:hover {
            border-bottom-color: #2e7d32;
        }

        .perfil-coach .btn {
            background: #2e7d32;
            color: white;
        }

        .perfil-coach .btn:hover {
            background: #1b5e20;
        }
    </style>
</head>

<body class="perfil-coach">
    <header class="main-header">
        <div class="logo-container"><img src="img/logo.png" alt="Logo" class="logo-img"></div>
        <nav>
            <a href="dashboard-coach.html">Inicio</a>
            <a href="perfil.html">Mi Perfil</a>
            <a href="#" id="logoutLink">Cerrar sesión</a>
        </nav>
    </header>
    <div class="dashboard-container">
        <h2>Panel de Coach | <span id="coachName">Cargando...</span></h2>
        <div class="dashboard-grid">
            <div class="card">
                <h3>Mis alumnos</h3>
                <ul id="alumnosList">
                    <li>Cargando...</li>
                </ul>
            </div>
            <div class="card">
                <h3>Clases asignadas</h3>
                <ul>
                    <li>Entrenamiento funcional - Martes 19:00</li>
                    <li>Boxeo - Jueves 18:00</li>
                </ul>
            </div>
            <div class="card">
                <h3>Horarios del coach</h3>
                <ul>
                    <li>Lunes 10:00 - 13:00</li>
                    <li>Martes 16:00 - 20:00</li>
                    <li>Jueves 16:00 - 20:00</li>
                </ul>
            </div>
        </div>
        <div class="botones-perfil">
            <button class="btn" id="editProfileBtn">Editar perfil</button>
            <button class="btn btn-secundario" id="logoutBtn">Cerrar sesión</button>
        </div>
    </div>
    <script>
        const API_URL = 'http://localhost:3000/api';
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';

        async function loadCoachData() {
            try {
                const res = await fetch(`${API_URL}/auth/me`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!res.ok) throw new Error();
                const result = await res.json();
                const user = result.data;
                document.getElementById('coachName').textContent = user.full_name;
                // Opcional: cargar alumnos (endpoint /api/users?role=user)
                const alumnosRes = await fetch(`${API_URL}/users?role=user`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (alumnosRes.ok) {
                    const alumnosResult = await alumnosRes.json();
                    const alumnos = alumnosResult.data;
                    const lista = document.getElementById('alumnosList');
                    lista.innerHTML = '';
                    alumnos.forEach(a => {
                        lista.innerHTML += `<li>${a.full_name} - ${a.email}</li>`;
                    });
                }
            } catch (err) {
                localStorage.clear();
                window.location.href = 'login.html';
            }
        }
        loadCoachData();
        document.getElementById('editProfileBtn').onclick = () => window.location.href = 'perfil.html';
        function cerrarSesion() { localStorage.clear(); window.location.href = 'login.html'; }
        document.getElementById('logoutBtn').onclick = cerrarSesion;
        document.getElementById('logoutLink').onclick = (e) => { e.preventDefault(); cerrarSesion(); };
    </script>
</body>

</html>
