<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportClub - Mi panel (Usuario)</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .perfil-usuario nav a:hover {
            border-bottom-color: #0077b6;
        }

        .perfil-usuario .btn {
            background: #0077b6;
            color: white;
        }

        .perfil-usuario .btn:hover {
            background: #005f8c;
        }

        .avatar-mini {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            margin-left: 10px;
            border: 1px solid #F2B705;
        }

        .nav-avatar {
            display: inline-flex;
            align-items: center;
        }

        .dashboard-container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
    </style>
</head>

<body class="perfil-usuario">
    <header class="main-header">
        <div class="logo-container">
            <img src="img/logo.png" alt="Logo" class="logo-img">
        </div>
        <nav class="nav-avatar">
            <a href="dashboard-usuario.html">Inicio</a>
            <a href="perfil.html">Perfil</a>
            <a href="#" id="logoutLink">Cerrar sesión</a>
            <img id="avatarNav" class="avatar-mini" src="" alt="Avatar" style="display:none;">
            <div id="avatarPlaceholderNav" class="avatar-mini"
                style="display:flex; align-items:center; justify-content:center; background:#e9ecef;">📷</div>
        </nav>
    </header>
    <div class="dashboard-container">
        <h2>Bienvenido, <span id="userName">Usuario</span></h2>
        <div class="dashboard-grid">
            <div class="card">
                <h3>Información personal</h3>
                <p><strong>Nombre:</strong> <span id="displayName">Cargando...</span></p>
                <p><strong>Correo:</strong> <span id="displayEmail">cargando...</span></p>
                <p><strong>Deporte:</strong> Fútbol</p>
            </div>
            <div class="card">
                <h3>Mis reservas</h3>
                <ul>
                    <li>Crossfit - Lunes 18:00</li>
                    <li>Spinning - Miércoles 19:00</li>
                </ul>
            </div>
            <div class="card">
                <h3>Clases disponibles</h3>
                <ul>
                    <li>Yoga</li>
                    <li>Funcional</li>
                    <li>Spinning</li>
                    <li>Boxeo</li>
                </ul>
            </div>
        </div>
        <div class="botones-perfil"><button class="btn" id="editProfileBtn">Editar perfil</button><button
                class="btn btn-secundario" id="logoutBtn">Cerrar sesión</button></div>
    </div>
    <script>
        const API_URL = 'http://localhost:3000/api';
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';

        function loadAvatar(email) {
            const stored = localStorage.getItem(`avatar_${email}`);
            const avatarImg = document.getElementById('avatarNav');
            const placeholder = document.getElementById('avatarPlaceholderNav');
            if (stored && stored.startsWith('data:image')) {
                avatarImg.src = stored;
                avatarImg.style.display = 'inline-block';
                placeholder.style.display = 'none';
            } else {
                avatarImg.style.display = 'none';
                placeholder.style.display = 'flex';
            }
        }

        async function loadUserData() {
            try {
                const res = await fetch(`${API_URL}/auth/me`, { headers: { 'Authorization': `Bearer ${token}` } });
                if (!res.ok) throw new Error();
                const result = await res.json();
                const user = result.data;
                document.getElementById('userName').textContent = user.full_name.split(' ')[0];
                document.getElementById('displayName').textContent = user.full_name;
                document.getElementById('displayEmail').textContent = user.email;
                loadAvatar(user.email);
            } catch (err) { localStorage.removeItem('token'); localStorage.removeItem('user'); window.location.href = 'login.html'; }
        }
        loadUserData();
        document.getElementById('editProfileBtn').onclick = () => window.location.href = 'perfil.html';
        function cerrarSesion() { localStorage.removeItem('token'); localStorage.removeItem('user'); window.location.href = 'login.html'; }
        document.getElementById('logoutBtn').onclick = cerrarSesion;
        document.getElementById('logoutLink').onclick = (e) => { e.preventDefault(); cerrarSesion(); };
    </script>
</body>

</html>
