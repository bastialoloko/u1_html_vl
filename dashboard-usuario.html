<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportClub - Mi panel (Usuario)</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .perfil-usuario nav a:hover {
            border-bottom-color: #0077b6;
        }

        .perfil-usuario .btn {
            background: #0077b6;
            color: white;
        }

        .perfil-usuario .btn:hover {
            background: #005f8c;
        }

        .dashboard-container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
    </style>
</head>

<body class="perfil-usuario">
    <header class="main-header">
        <div class="logo-container">
            <img src="img/logo.png" alt="Logo" class="logo-img">
        </div>
        <nav>
            <a href="index.html">Inicio</a>
        </nav>
    </header>
    <div class="dashboard-container">
        <h2>Bienvenido, <span id="userName">Usuario</span></h2>
        <div class="dashboard-grid">
            <div class="card">
                <h3>Información personal</h3>
                <p><strong>Nombre:</strong> <span id="displayName">Cargando...</span></p>
                <p><strong>Correo:</strong> <span id="displayEmail">cargando...</span></p>
                <p><strong>Deporte:</strong> Fútbol</p>
            </div>
            <div class="card">
                <h3>Mis reservas</h3>
                <ul>
                    <li>Crossfit - Lunes 18:00</li>
                    <li>Spinning - Miércoles 19:00</li>
                </ul>
            </div>
            <div class="card">
                <h3>Clases disponibles</h3>
                <ul>
                    <li>Yoga</li>
                    <li>Funcional</li>
                    <li>Spinning</li>
                    <li>Boxeo</li>
                </ul>
            </div>
        </div>
        <div class="botones-perfil">
            <button class="btn" id="editProfileBtn">Editar perfil</button>
            <button class="btn btn-secundario" id="logoutBtn">Cerrar sesión</button>
        </div>
    </div>
    <script>
        const API_URL = 'http://localhost:3000/api';
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';

        async function loadUserData() {
            try {
                const res = await fetch(`${API_URL}/auth/me`, { headers: { 'Authorization': `Bearer ${token}` } });
                if (!res.ok) throw new Error();
                const result = await res.json();
                const user = result.data;
                document.getElementById('userName').textContent = user.full_name.split(' ')[0];
                document.getElementById('displayName').textContent = user.full_name;
                document.getElementById('displayEmail').textContent = user.email;
            } catch (err) { localStorage.removeItem('token'); localStorage.removeItem('user'); window.location.href = 'login.html'; }
        }
        loadUserData();
        document.getElementById('editProfileBtn').onclick = () => window.location.href = 'perfil.html';
        function cerrarSesion() { localStorage.removeItem('token'); localStorage.removeItem('user'); window.location.href = 'login.html'; }
        document.getElementById('logoutBtn').onclick = cerrarSesion;
    </script>
</body>

</html>
