<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Deportivo - Recuperar contraseña</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1 class="logo">Club Deportivo</h1>
            <h2>Recuperar contraseña</h2>
            <form id="recoverForm">
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <button type="submit" class="btn">Recuperar contraseña</button>
                <div id="message" class="message hidden"></div>
                <div class="links">
                    <a href="login.html">← Volver al inicio de sesión</a>
                </div>
            </form>
        </div>
    </div>
    <script>
        document.getElementById('recoverForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const msgDiv = document.getElementById('message');
            if(email.trim() !== "") {
                msgDiv.textContent = 'Se ha enviado un enlace de recuperación a su correo.';
            } else {
                msgDiv.textContent = 'Por favor ingrese un correo electrónico.';
            }
            msgDiv.classList.remove('hidden');
        });
    </script>
</body>
</html>
