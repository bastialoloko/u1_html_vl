<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Deportivo - Registro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1 class="logo">Club Deportivo</h1>
            <h2>Registro de nuevo usuario</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label for="email">Correo electrónico <span class="required">*</span></label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña <span class="required">*</span></label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-group">
                    <label for="nombre">Nombre (opcional)</label>
                    <input type="text" id="nombre" name="nombre">
                </div>
                <div class="form-group">
                    <label for="edad">Edad (opcional)</label>
                    <input type="number" id="edad" name="edad" min="0" max="120">
                </div>
                <div class="form-group">
                    <label for="practicaDeporte">¿Practica deporte? (opcional)</label>
                    <select id="practicaDeporte" name="practicaDeporte">
                        <option value="">Seleccione...</option>
                        <option value="si">Sí</option>
                        <option value="no">No</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="tipoDeporte">Tipo de deporte (opcional)</label>
                    <input type="text" id="tipoDeporte" name="tipoDeporte" placeholder="Ej: Fútbol, Tenis, Natación">
                </div>
                <div class="form-group">
                    <label for="objetivo">Objetivo personal (opcional)</label>
                    <textarea id="objetivo" name="objetivo" rows="2" placeholder="Ej: Mejorar condición física, competir, divertirme"></textarea>
                </div>
                <div class="form-group">
                    <label for="nivel">Nivel (opcional)</label>
                    <select id="nivel" name="nivel">
                        <option value="">Seleccione...</option>
                        <option value="principiante">Principiante</option>
                        <option value="intermedio">Intermedio</option>
                        <option value="avanzado">Avanzado</option>
                    </select>
                </div>
                <button type="submit" class="btn">Registrarse</button>
                <div class="links">
                    <a href="index.html">← Volver al inicio de sesión</a>
                </div>
            </form>
        </div>
    </div>
    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Registro simulado. (Los datos solo se validan localmente)');
        });
    </script>
</body>
</html>
