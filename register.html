<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportClub - Registro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="main-header">
        <div class="logo-container">
            <img src="img/logo.png" alt="Logo" class="logo-img">
        </div>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <div class="container">
        <h2>Registro de usuario</h2>
        <form id="registerForm">
            <div class="form-group">
                <label>Nombre *</label>
                <input type="text" id="nombre" required>
            </div>
            <div class="form-group">
                <label>Correo electrónico *</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Contraseña *</label>
                <input type="password" id="password" required>
            </div>
            <div class="form-group">
                <label>Deporte favorito (opcional)</label>
                <input type="text" id="deporte" placeholder="Ej: Fútbol, Natación">
            </div>
            <div class="form-group">
                <label>Objetivo (opcional)</label>
                <textarea rows="2" id="objetivo" placeholder="Mejorar condición física, perder peso..."></textarea>
            </div>
            <button type="submit" class="btn">Registrarse</button>
            <div class="links">
                <a href="login.html">Volver al login</a>
            </div>
        </form>
    </div>
    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Registro simulado. Ya puedes iniciar sesión.');
            window.location.href = "login.html";
        });
    </script>
</body>
</html>
