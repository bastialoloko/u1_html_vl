<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportClub - Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .error-message {
            color: #dc3545;
            font-size: 0.85rem;
            margin-top: 0.25rem;
            display: block;
        }

        .input-error {
            border-color: #dc3545;
        }
    </style>
</head>

<body>
    <header class="main-header">
        <div class="logo-container"><img src="img/logo.png" alt="Logo" class="logo-img"></div>
        <nav><a href="index.html">Inicio</a>
    </header>
    <div class="container mt-5" style="max-width: 600px;">
        <div class="card p-4 shadow">
            <h2 class="text-center">Registro de nuevo usuario</h2>
            <form id="registerForm">
                <div class="mb-3">
                    <label class="form-label">Nombre completo *</label>
                    <input type="text" id="fullName" class="form-control" required>
                    <div class="error-message" id="fullNameError"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Correo electrónico *</label>
                    <input type="email" id="email" class="form-control" required>
                    <div class="error-message" id="emailError"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña * (mínimo 8 caracteres)</label>
                    <input type="password" id="password" class="form-control" required>
                    <div class="error-message" id="passwordError"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Confirmar contraseña *</label>
                    <input type="password" id="confirmPassword" class="form-control" required>
                    <div class="error-message" id="confirmError"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Deporte favorito (opcional)</label>
                    <input type="text" id="deporte" class="form-control">
                </div>
                <button type="submit" class="btn w-100" style="background:#F2B705; color:#2E1A47;">Registrarse</button>
                <div class="text-center mt-3"><a href="login.html">Volver al login</a></div>
                <div id="generalError" class="alert alert-danger mt-3 d-none"></div>
            </form>
        </div>
    </div>
    <script>
        const API_URL = 'http://localhost:3000/api';
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            // limpiar errores
            document.querySelectorAll('.error-message').forEach(el => el.textContent = '');
            document.querySelectorAll('.form-control').forEach(el => el.classList.remove('input-error'));
            document.getElementById('generalError').classList.add('d-none');

            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;
            let hasError = false;

            if (!fullName) { showError('fullNameError', 'El nombre es obligatorio'); hasError = true; }
            if (!email) { showError('emailError', 'El correo es obligatorio'); hasError = true; }
            else if (!email.includes('@')) { showError('emailError', 'Email inválido'); hasError = true; }
            if (!password) { showError('passwordError', 'La contraseña es obligatoria'); hasError = true; }
            else if (password.length < 8) { showError('passwordError', 'Mínimo 8 caracteres'); hasError = true; }
            if (password !== confirm) { showError('confirmError', 'Las contraseñas no coinciden'); hasError = true; }
            if (hasError) return;

            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ full_name: fullName, email, password, role: 'user', deporte: document.getElementById('deporte').value })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.message || 'Error en registro');
                alert('Registro exitoso. Ya puedes iniciar sesión.');
                window.location.href = 'login.html';
            } catch (err) {
                document.getElementById('generalError').textContent = err.message;
                document.getElementById('generalError').classList.remove('d-none');
            }
        });
        function showError(id, msg) {
            document.getElementById(id).textContent = msg;
            document.getElementById(id.replace('Error', '')).classList.add('input-error');
        }
    </script>
</body>

</html>
